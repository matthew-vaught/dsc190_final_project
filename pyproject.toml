[project]
name = "dsc190-final-project"
version = "0.1.0"
description = "A command-line surf conditions checker for San Diego and Orange County."
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
surf-conditions = "surf_conditions.cli:main"

[dependency-groups]
dev = [
    "dvc>=3.67.1; python_version >= '3.10'",
    "mypy>=2.1.0; python_version >= '3.10'",
    "pytest>=9.0.3; python_version >= '3.10'",
    "ruff>=0.15.16; python_version >= '3.10'",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/surf_conditions"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
